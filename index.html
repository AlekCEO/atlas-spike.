<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S1 · EXIF из фото</title>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js"></script>
<style>
  body{margin:0;padding:16px;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:4px 0 12px;color:#6e6e73}
  .env{font-size:12px;background:#fff;border-radius:10px;padding:10px;margin-bottom:12px;word-break:break-all}
  label.btn{display:block;background:#0071e3;color:#fff;text-align:center;padding:14px;border-radius:12px;margin-bottom:10px;font-weight:600}
  label.btn.alt{background:#1d1d1f}
  input[type=file]{display:none}
  .card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid #f0f0f2}
  .row:last-child{border:0}
  .k{color:#6e6e73}
  .ok{color:#1a7f37;font-weight:600}
  .no{color:#d70015;font-weight:600}
  .name{font-weight:600;margin-bottom:6px;word-break:break-all}
  textarea{width:100%;height:120px;font:12px monospace;box-sizing:border-box;margin-top:6px}
  button{width:100%;padding:12px;border:0;border-radius:12px;background:#e8e8ed;font-size:15px;margin-top:6px}
  select{width:100%;padding:10px;border-radius:10px;border:1px solid #d2d2d7;margin-bottom:10px;font-size:15px}
</style>
</head>
<body>
<h1>S1 · Есть ли GPS в выбранных фото?</h1>
<p>Страница ничего не сохраняет и не отправляет: всё читается прямо в браузере.</p>

<div class="env" id="env"></div>

<select id="src">
  <option value="Библиотека фото, HEIC">Источник: Библиотека фото, HEIC</option>
  <option value="Библиотека фото, JPEG">Источник: Библиотека фото, JPEG</option>
  <option value="Снимок камерой из окна выбора">Источник: Снимок камерой из окна выбора</option>
  <option value="Приложение Файлы">Источник: Приложение «Файлы»</option>
  <option value="Другое">Источник: другое</option>
</select>

<label class="btn">Выбрать фото (можно несколько)<input type="file" id="f1" accept="image/*" multiple></label>
<label class="btn alt">Снять камерой (прямая съёмка)<input type="file" id="f2" accept="image/*" capture="environment"></label>
<label class="btn alt">Выбрать любой файл (без фильтра типа)<input type="file" id="f3" multiple></label>

<div id="out"></div>

<div class="card">
  <b>Отчёт для копирования</b>
  <textarea id="rep" readonly></textarea>
  <button id="copy">Скопировать отчёт</button>
</div>

<script>
var results = [];
function fmt(v, d){ return (v === undefined || v === null || v === '') ? null : (typeof v === 'number' && d != null ? v.toFixed(d) : String(v)); }
function env(){
  var standalone = (window.navigator.standalone === true) || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return {
    mode: standalone ? 'установлено на экран Домой' : 'вкладка браузера',
    ua: navigator.userAgent,
    secure: window.isSecureContext ? 'HTTPS/безопасный' : 'HTTP'
  };
}
var E = env();
document.getElementById('env').innerHTML = '<b>' + E.mode + '</b> · ' + E.secure + '<br>' + E.ua;

function row(k, v, good){
  return '<div class="row"><span class="k">' + k + '</span><span class="' + (good === true ? 'ok' : good === false ? 'no' : '') + '">' + v + '</span></div>';
}
async function handle(files, inputName){
  var src = document.getElementById('src').value;
  for (var i = 0; i < files.length; i++){
    var f = files[i], r = {file: f.name, type: f.type || '(пусто)', sizeKB: Math.round(f.size/1024), input: ({f1: 'выбор фото', f2: 'камера (capture)', f3: 'любой файл'})[inputName], source: src, mode: E.mode};
    var html = '<div class="card"><div class="name">' + f.name + '</div>';
    try{
      var all = await exifr.parse(f, {gps: true, tiff: true, exif: true, ifd0: true, ifd1: false, xmp: false, translateValues: false, reviveValues: true});
      var gps = await exifr.gps(f).catch(function(){ return null; });
      all = all || {};
      r.hasExif = !!Object.keys(all).length;
      r.lat = gps && gps.latitude != null ? gps.latitude : null;
      r.lng = gps && gps.longitude != null ? gps.longitude : null;
      r.direction = all.GPSImgDirection != null ? all.GPSImgDirection : null;
      r.time = all.DateTimeOriginal ? new Date(all.DateTimeOriginal).toISOString() : null;
      r.orientation = all.Orientation != null ? all.Orientation : null;
      r.camera = [all.Make, all.Model].filter(Boolean).join(' ') || null;
    }catch(e){
      r.error = String(e && e.message || e);
      try{
        var buf = await f.arrayBuffer(), u = new Uint8Array(buf);
        var asc = function(a, b){ var s = ''; for (var k = a; k < b && k < u.length; k++) s += (u[k] >= 32 && u[k] < 127) ? String.fromCharCode(u[k]) : '.'; return s; };
        r.head = asc(0, 32);
        r.brand = asc(8, 12);
        r.hasExifTag = asc(0, 300000).indexOf('Exif') >= 0;
        try{
          var p2 = await exifr.parse(buf);
          r.retryDefault = p2 ? Object.keys(p2).length + ' тегов' : 'null';
          var g2 = await exifr.gps(buf);
          r.retryGps = g2 && g2.latitude != null ? g2.latitude + ', ' + g2.longitude : null;
        }catch(e2){ r.retryDefault = 'ошибка: ' + (e2 && e2.message || e2); }
        // обходной путь: найти в HEIC заголовок TIFF после "Exif\0\0" и отдать exifr только его
        var idx = -1;
        for (var k = 0; k < Math.min(u.length - 8, 3000000); k++){
          if (u[k] === 0x45 && u[k+1] === 0x78 && u[k+2] === 0x69 && u[k+3] === 0x66 && u[k+4] === 0 && u[k+5] === 0 &&
              ((u[k+6] === 0x4D && u[k+7] === 0x4D) || (u[k+6] === 0x49 && u[k+7] === 0x49))){ idx = k + 6; break; }
        }
        r.tiffAt = idx;
        if (idx >= 0){
          var tiff = buf.slice(idx);
          var p3 = await exifr.parse(tiff, {gps: true, tiff: true, exif: true, ifd0: true, translateValues: false, reviveValues: true}) || {};
          var g3 = await exifr.gps(tiff).catch(function(){ return null; });
          r.recovered = true;
          r.hasExif = true;
          r.lat = g3 && g3.latitude != null ? g3.latitude : null;
          r.lng = g3 && g3.longitude != null ? g3.longitude : null;
          r.direction = p3.GPSImgDirection != null ? p3.GPSImgDirection : null;
          r.time = p3.DateTimeOriginal ? new Date(p3.DateTimeOriginal).toISOString() : null;
          r.orientation = p3.Orientation != null ? p3.Orientation : null;
          r.camera = [p3.Make, p3.Model].filter(Boolean).join(' ') || null;
        }
      }catch(e3){ r.diagError = String(e3); }
    }
    html += row('Формат / размер', r.type + ' · ' + r.sizeKB + ' КБ');
    if (r.error && !r.recovered){
      html += row('Ошибка чтения', r.error, false);
      if (r.head !== undefined){
        html += row('Начало файла', r.head);
        html += row('Метка формата', r.brand);
        html += row('В файле есть блок Exif', r.hasExifTag ? 'да' : 'нет', r.hasExifTag);
        html += row('Повтор чтения', r.retryDefault || '-');
        html += row('Повтор: GPS', r.retryGps || 'нет', !!r.retryGps);
      }
    } else {
      if (r.recovered) html += row('Чтение', 'обходным способом (HEIC)', true);
      html += row('EXIF вообще', r.hasExif ? 'есть' : 'нет', r.hasExif);
      html += row('Координаты', r.lat != null ? fmt(r.lat,6) + ', ' + fmt(r.lng,6) : 'НЕТ', r.lat != null);
      html += row('Направление камеры', r.direction != null ? fmt(r.direction,1) + '°' : 'нет', r.direction != null);
      html += row('Время съёмки', r.time || 'нет', !!r.time);
      html += row('Ориентация', r.orientation != null ? r.orientation : 'нет');
      html += row('Камера', r.camera || 'нет');
    }
    html += '</div>';
    document.getElementById('out').insertAdjacentHTML('afterbegin', html);
    results.push(r);
  }
  document.getElementById('rep').value = JSON.stringify({env: E, results: results}, null, 1);
}
['f1','f2','f3'].forEach(function(id){
  document.getElementById(id).addEventListener('change', function(e){
    if (e.target.files && e.target.files.length) handle(Array.prototype.slice.call(e.target.files), id);
    e.target.value = '';
  });
});
document.getElementById('copy').addEventListener('click', function(){
  var t = document.getElementById('rep'); t.select();
  try{ navigator.clipboard ? navigator.clipboard.writeText(t.value) : document.execCommand('copy'); }catch(e){ document.execCommand('copy'); }
});
</script>
</body>
</html>
